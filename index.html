<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Nutrición · Base de alimentos</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%235fd98d' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M12 21c0-6 3-10 8-11 0 6-3 10-8 11Z'/%3E%3Cpath d='M12 21C8 16 5 13 4 7c6 0 8 4 8 8'/%3E%3Cpath d='M12 21v-6'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div class="app">
  <!-- ------------------------------------------------------ barra lateral -->
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 21c0-6 3-10 8-11 0 6-3 10-8 11Z"/>
          <path d="M12 21C8 16 5 13 4 7c6 0 8 4 8 8"/>
          <path d="M12 21v-6"/>
        </svg>
      </div>
      <div class="brand-txt">
        <b>Nutrición</b>
        <span>Basada en alimentos e ingredientes comunes</span>
      </div>
    </div>

    <nav class="nav" id="nav" aria-label="Secciones">
      <button class="nav-item is-active" data-view="catalogo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/>
          <rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/>
        </svg>
        <span>Catálogo de alimentos</span>
      </button>
      <button class="nav-item" data-view="metas">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2"/>
        </svg>
        <span>Calculadora metas</span>
      </button>
      <button class="nav-item" data-view="comida">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 3v7a2 2 0 0 0 2 2h0a2 2 0 0 0 2-2V3"/><path d="M6 12v9"/>
          <path d="M16 3c-1.7 1.2-2.5 3.2-2.5 5.5 0 1.7.9 3 2.5 3.5V21"/>
        </svg>
        <span>Calculadora comida</span>
      </button>
      <button class="nav-item" data-view="reportes">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8Z"/>
          <path d="M14 3v5h5"/><path d="M9 13h6M9 17h4"/>
        </svg>
        <span>Reportes</span>
      </button>
    </nav>

    <div class="side-block">
      <div class="side-label">Datos</div>
      <button class="side-btn" id="btn-import">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3v12"/><path d="m8 11 4 4 4-4"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/>
        </svg>
        Importar reportes
      </button>
      <button class="side-btn" id="btn-export">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 15V3"/><path d="m8 7 4-4 4 4"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/>
        </svg>
        Exportar reportes
      </button>
      <input type="file" id="file-import" accept="application/json,.json" hidden>
    </div>

    <div class="side-foot">
      <span id="db-info">— alimentos</span>
      <span class="sep">·</span>
      <span id="store-state">local</span>
    </div>
  </aside>

  <!-- ---------------------------------------------------------- contenido -->
  <main class="main" id="main">
    <section class="view is-active" id="view-catalogo"></section>
    <section class="view" id="view-metas"></section>
    <section class="view" id="view-comida"></section>
    <section class="view" id="view-reportes"></section>
  </main>
</div>

<div id="modal-root"></div>
<div class="toast-root" id="toast-root" aria-live="polite"></div>

<script src="data/alimentos.js"></script>
<script src="js/util.js"></script>
<script src="js/store.js"></script>
<script src="js/nutrition.js"></script>
<script src="js/gallery.js"></script>
<script src="js/metab.js"></script>
<script src="js/meal.js"></script>
<script src="js/reports.js"></script>
<script src="js/app.js"></script>
</body>
</html>
